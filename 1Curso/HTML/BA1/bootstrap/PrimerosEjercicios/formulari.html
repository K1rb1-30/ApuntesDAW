<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Formulario de inicio de sesion</title>
  <link rel="stylesheet" href="/css/bootstrap.css">

</head>
<body>
<div class="container-fluid">
  <div class="bg-primary text-center">
    <h1 class="text-center my-2">Bienvenido Entrenador</h1>
    <img class=" w-25" src="https://images.wikidexcdn.net/mwuploads/wikidex/thumb/f/f8/latest/20200428203046/Gengar.png/800px-Gengar.png" alt="">
    <form>
      <div>
        <label for="Username">Username</label>
        <input id="Username" type="text">
      </div>
      <div>
        <label for="Password">Password</label>
        <input id="Password" type="password">
      </div>
      <div>
        <button type="submit">Iniciar Sesión</button>
      </div>
    </form>
  </div>
</div>




</body>
</html>
