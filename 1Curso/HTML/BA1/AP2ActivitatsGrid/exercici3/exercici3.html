<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
  <link rel="stylesheet" href="exercici3.css">

  <!-- FUENTE MONSERRAT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
</head>

<body>
<section class="contenedor1">
  <div class="titulo">
    <h1>Login</h1>
  </div>

  <form action="" method="post">
    <div class="imgcontainer">
      <img src="ODS.jpg" alt="Avatar" class="avatar">
    </div>

    <div class="container">
      <div class="contentinput">
        <label class="labelform" for="name"><b>Username:</b></label>
        <input class="inputform" id="name" type="text" placeholder="Enter Username" name="uname" required>
      </div>
      <div class="contentinput">
        <label class="labelform" for="psw"><b>Password:</b></label>
        <input class="inputform" id="psw" type="password" placeholder="Enter Password" name="psw" required>
      </div>

    </div>

    <div class="menuboton">
      <button type="submit">Login</button>
      <div class="extras">
        <label class="containerfor">
          <input type="checkbox" checked="checked" name="remember"> Remember me
        </label>
        <div class="containerfor">
          <span class="psw">Forgot <a href="#">password?</a></span>
        </div>
      </div>


    </div>



  </form>

</section>


</body>
</html>
